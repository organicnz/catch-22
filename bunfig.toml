# Bun configuration file
# See https://bun.sh/docs/runtime/config for more information

[install]
# Ensure we use the lockfile
lockfile = true

[run]
# Standard run options

[test]
# Playwright instant-navigation guards (e2e/) run via `playwright test`, not bun test.
pathIgnorePatterns = ["e2e/**"]

[lint]
ignorePatterns = [
  ".next",
  "node_modules",
  "src/types/supabase.ts",
  "supabase/functions",
  "scratch",
  "scripts"
]

[lint.rules]
"react/no-unknown-property" = "error"
"react/jsx-no-target-blank" = "error"
"react/self-closing-comp" = "warn"
"react-hooks/rules-of-hooks" = "error"
"react-hooks/exhaustive-deps" = "off"
"@next/next/no-html-link-for-pages" = "error"
"@next/next/no-img-element" = "warn"
"@next/next/no-sync-scripts" = "error"
"react/purity" = "off"
"no-control-regex" = "off"
"no-useless-assignment" = "off"

[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
jsxSingleQuote = false
trailingComma = "es5"
bracketSpacing = true
arrowParens = "always"
endOfLine = "lf"
ignorePatterns = [
  "src/types/supabase.ts",
  "supabase/functions/**",
  "scratch/**",
  "scripts/**"
]
