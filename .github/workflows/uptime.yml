name: Uptime

# Production availability probe. Runs on GitHub-hosted infra (not the
# self-hosted runner) so it stays independent of anything that could take
# the runner — or the site — down together.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        id: health
        run: |
          CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 20 https://www.catch-22.co.nz/api/health)
          echo "status=$CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/health.json || true
          if [ "$CODE" != "200" ]; then
            echo "::error::Production /api/health returned $CODE"
            exit 1
          fi

      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Production down — /api/health failing (${new Date().toISOString().slice(0, 16)}Z)`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['incident'],
                body: [
                  '`/api/health` returned a non-200 response from production.',
                  '',
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Check: Vercel dashboard → Usage (pause risk?) and Deployments (last deploy status).',
                ].join('\n'),
              });
            }
