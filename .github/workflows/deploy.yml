name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint & type-check
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome ci src/

      - name: Oxlint
        run: bunx oxlint src/

      - name: TypeScript type check
        run: bunx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Run tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Supabase — DB migrations + edge function deployments
  #    Only runs on push to main
  # ─────────────────────────────────────────────────────────────────────────────
  supabase:
    name: Supabase (Migrations + Edge Functions)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run DB migrations
        # SUPABASE_DB_URL: postgresql://postgres.<ref>:<pw>@<host>.pooler.supabase.com:5432/postgres
        # Get DB password from: Supabase Dashboard → Settings → Database → Database password
        # Then update the SUPABASE_DB_URL secret in GitHub: github.com/organicnz/catch-22-next/settings/secrets/actions
        run: |
          if echo "$SUPABASE_DB_URL" | grep -q "REPLACE_DB_PASSWORD"; then
            echo "⚠️  SUPABASE_DB_URL contains placeholder — skipping migrations"
            echo "   Update the SUPABASE_DB_URL secret with your real DB password to enable migrations"
          else
            supabase db push --db-url "$SUPABASE_DB_URL"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy edge functions
        # CLI-based deploy: bundles relative imports (e.g. checkout's
        # src/config/shipping.ts) and preserves function env from the Vault.
        # The raw Management API body deploy does NOT bundle — functions boot
        # with BOOT_ERROR — so we must use the CLI here.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy webhook checkout --project-ref "$PROJECT_REF"
          echo "✅ Edge functions deployed via CLI"

  # Vercel deployment is handled automatically by Vercel's GitHub integration.
  # Push to main → Vercel detects and deploys. No workflow step needed.
