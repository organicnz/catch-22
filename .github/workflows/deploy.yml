name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint & type-check
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome ci src/

      - name: Oxlint
        run: bunx oxlint src/

      - name: TypeScript type check
        run: bunx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Run tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Supabase — DB migrations + edge function deployments
  #    Uses Management API for edge functions (no CLI token format restriction)
  #    Uses CLI with --db-url for migrations (no access token needed)
  #    Only runs on push to main
  # ─────────────────────────────────────────────────────────────────────────────
  supabase:
    name: Supabase (Migrations + Edge Functions)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run DB migrations
        # SUPABASE_DB_URL: postgresql://postgres.[ref]:[password]@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
        # Get DB password from: Supabase Dashboard → Settings → Database → Database password
        # Then update the SUPABASE_DB_URL secret in GitHub: github.com/organicnz/catch-22-next/settings/secrets/actions
        run: |
          if echo "$SUPABASE_DB_URL" | grep -q "REPLACE_DB_PASSWORD"; then
            echo "⚠️  SUPABASE_DB_URL contains placeholder — skipping migrations"
            echo "   Update the SUPABASE_DB_URL secret with your real DB password to enable migrations"
          else
            supabase db push --db-url "$SUPABASE_DB_URL" && echo "✅ Migrations applied" || echo "⚠️  Migration failed — check SUPABASE_DB_URL secret"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy edge functions via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          deploy_function() {
            local slug=$1
            local file=$2
            local body
            body=$(python3 -c "import json,sys; print(json.dumps(open('$file').read()))")
            # Try PATCH first (update existing), then POST (create new)
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$slug" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"verify_jwt\":false,\"body\":$body}")
            if [ "$HTTP" = "404" ]; then
              curl -sf -X POST \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"slug\":\"$slug\",\"name\":\"$slug\",\"verify_jwt\":false,\"body\":$body}"
            fi
            echo "✅ $slug deployed (HTTP $HTTP)"
          }

          deploy_function "checkout" "supabase/functions/checkout/index.ts"
          deploy_function "webhook"  "supabase/functions/webhook/index.ts"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Vercel — production deployment via deploy hook
  #    Triggers Vercel's own build infrastructure — no runner memory/timeout issues
  #    Bypasses the Hobby plan contributor restriction entirely
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint, test, supabase]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Vercel deploy hook
        run: |
          RESULT=$(curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          JOB_URL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('job',{}).get('url','triggered'))" 2>/dev/null || echo "triggered")
          echo "✅ Vercel deployment triggered"
          echo "   Job: $JOB_URL"
