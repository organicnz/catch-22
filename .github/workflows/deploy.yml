name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint & type-check
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome ci src/

      - name: Oxlint
        run: bunx oxlint src/

      - name: TypeScript type check
        run: bunx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Run tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Supabase — DB migrations + edge function deployments
  #    Only runs on push to main. Failure here fails the whole run.
  # ─────────────────────────────────────────────────────────────────────────────
  supabase:
    name: Supabase (Migrations + Edge Functions)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      # ── 0. Fail loudly on misconfiguration — never skip silently ────────────
      # DB access is token-only (supabase db push --linked): the CLI leases a
      # connection through the Management API, so no DB password secret is
      # needed anywhere. Validate the secret *formats* up front so a malformed
      # token/ref fails in seconds here instead of at deploy time.
      - name: Verify configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets are not configured."
            exit 1
          fi
          if ! echo "$SUPABASE_ACCESS_TOKEN" | grep -qE '^sbp_[a-f0-9]{40}$'; then
            echo "::error::SUPABASE_ACCESS_TOKEN has an invalid format (expected sbp_ followed by 40 hex chars)."
            echo "::error::Create a classic PAT at https://supabase.com/dashboard/account/tokens —"
            echo "::error::  sbp_v0_.. (experimental) and legacy JWTs are rejected by the CLI."
            exit 1
          fi
          if ! echo "$SUPABASE_PROJECT_REF" | grep -qE '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF has an invalid format (expected 20 lowercase alphanumerics)."
            exit 1
          fi
          echo "✅ Configuration verified"

      # ── 1. Link project, then migrations: dry-run → apply (retry) → verify ─
      # Stale remote-only ledger rows (older manual syncs) block db push; they
      # are repaired as 'reverted' if found. Local-only pending migrations show
      # up in the dry-run and must all be applied.
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Run DB migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "── Pending migrations (dry-run) ──"
          PRE=$(supabase db push --linked --dry-run 2>&1 || true)
          echo "$PRE"
          if echo "$PRE" | grep -qE "Remote migration versions not found"; then
            echo "── Repairing stale remote-only migration ledger rows ──"
            VERSIONS=$(echo "$PRE" | grep -oE "[0-9]{14}" | sort -u | tr '\n' ' ')
            # shellcheck disable=SC2086
            supabase migration repair --status reverted --linked $VERSIONS --yes
          fi

          for attempt in 1 2 3; do
            echo "── db push (attempt $attempt/3) ──"
            if supabase db push --linked --yes; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::supabase db push failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

          echo "── Verifying nothing is pending ──"
          REMAINING=$(supabase db push --linked --dry-run 2>&1 || true)
          echo "$REMAINING"
          if echo "$REMAINING" | grep -qE "[0-9]{6,}_[a-z]"; then
            echo "::error::Migrations are still pending after push:"
            echo "$REMAINING"
            exit 1
          fi

          echo "── Verifying full ledger sync (local ↔ remote) ──"
          SYNC=$(supabase migration list --linked 2>&1)
          echo "$SYNC"
          BAD=$(echo "$SYNC" | awk -F'|' '
            $2 ~ /[0-9]{14}/ && $3 ~ /[0-9]{14}/ {
              gsub(/[` ]/, "", $2); gsub(/[` ]/, "", $3)
              if ($2 != $3) print "  local:" $2 "  remote:" $3
            }')
          if [ -n "$BAD" ]; then
            echo "::error::Migration ledger is NOT fully in sync (SQL editor drift or manual repair):"
            echo "$BAD"
            echo "::error::Resolve locally with: bun x supabase@latest migration repair --status reverted <versions> --linked"
            exit 1
          fi
          echo "✅ Migrations applied and ledger 100% in sync"

      # ── 2. Edge functions: pre-flight secrets + deploy each with retry ─────
      # Every function validates its required env vars at boot (and the boot
      # probes below would catch a missing one), but failing *before* deploy is
      # cheaper and the error is clearer. `supabase secrets list` is token-only.
      - name: Verify function secrets are provisioned
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          REQUIRED="STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY"
          SECRETS=$(supabase secrets list --project-ref "$PROJECT_REF" | awk '{print $1}')
          MISSING=""
          for s in $REQUIRED; do
            if ! echo "$SECRETS" | grep -qx "$s"; then
              MISSING="$MISSING $s"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Function secrets missing from the Vault:$MISSING"
            echo "::error::Add them with: supabase secrets set <NAME>=<value> --project-ref $PROJECT_REF"
            echo "::error::Functions fail at boot without them — deploy aborted before shipping."
            exit 1
          fi
          echo "✅ Required function secrets present in Vault"

      # CLI-based deploy: bundles relative imports (e.g. checkout's
      # src/config/shipping.ts) and preserves function env from the Vault.
      # The raw Management API body deploy does NOT bundle — functions boot
      # with BOOT_ERROR — so we must use the CLI here.
      # --no-verify-jwt is explicit so a fresh function can never quietly
      # become JWT-gated (the storefront calls it with an anonymous key).
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for slug in webhook checkout; do
            for attempt in 1 2 3; do
              echo "── deploy $slug (attempt $attempt/3) ──"
              if supabase functions deploy "$slug" --project-ref "$PROJECT_REF" --no-verify-jwt; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Deploy of $slug failed after 3 attempts."
                exit 1
              fi
              sleep 10
            done
          done
          echo "✅ Edge functions deployed"

      # ── 3. Post-deploy verification ─────────────────────────────────────────
      # (a) Management API reports ACTIVE, (b) the runtime actually boots
      # (2xx/4xx answer; 5xx means BOOT_ERROR or a crash at startup).
      - name: Verify function status is ACTIVE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for slug in webhook checkout; do
            STATUS=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$slug" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','UNKNOWN'))")
            echo "  $slug: $STATUS"
            if [ "$STATUS" != "ACTIVE" ]; then
              echo "::error::$slug is $STATUS, expected ACTIVE."
              exit 1
            fi
          done
          echo "✅ Both functions ACTIVE"

      - name: Verify functions boot in production
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # checkout probe: an impossible product id drives the real handler
          # path — JSON parse → cart normalization → Supabase product lookup
          # (service role key) → "Product not found" 400 — without ever
          # creating a Stripe session or an order.
          # webhook probe: unsigned {} is rejected at the first gate
          # (missing stripe-signature header) with 400 — proof it booted.
          probe() {
            case "$1" in
              checkout) echo '{"items":[{"id":2147483647,"quantity":1}]}' ;;
              webhook)  echo '{}' ;;
            esac
          }
          for slug in webhook checkout; do
            for attempt in 1 2 3 4 5; do
              RESP=$(curl -s -w "\n%{http_code}" \
                -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$slug" \
                -H "Content-Type: application/json" -d "$(probe "$slug")")
              CODE=$(echo "$RESP" | tail -n1)
              if [[ "$CODE" != 5* ]] && [[ "$CODE" != "000" ]]; then
                echo "  $slug booted (HTTP $CODE)"
                break
              fi
              echo "  $slug not ready (HTTP $CODE) — attempt $attempt/5"
              if [ "$attempt" -eq 5 ]; then
                echo "::error::$slug fails to boot (HTTP $CODE). Response:"
                echo "$RESP" | head -n -1
                exit 1
              fi
              sleep 5
            done
          done
          echo "✅ Both functions booted"

      # ── 4. Deployment summary — a durable record on every run ──────────────
      - name: Publish deployment summary
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          {
            echo "## ☁️ Supabase deployment"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "### Edge functions"
            echo '```'
            curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | python3 -c "import json,sys; [print(f\"{f['slug']}: {f['status']} v{f['version']}\") for f in json.load(sys.stdin)]"
            echo '```'
            echo ""
            echo "### Migration ledger"
            echo '```'
            supabase migration list --linked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Summary published"

  # Vercel deployment is handled automatically by Vercel's GitHub integration.
  # Push to main → Vercel detects and deploys. No workflow step needed.
