name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Runner disk guard — self-hosted runners die silently when the disk
  #    fills with build artifacts. Fail loudly below the watermark.
  # ─────────────────────────────────────────────────────────────────────────────
  preflight:
    name: Runner Disk Guard
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Verify free disk space (fail under 2 GB)
        run: |
          FREE_KB=$(df -Pk . | awk 'NR==2{print $4}')
          echo "Free: $((FREE_KB / 1024)) MB"
          if [ "$FREE_KB" -lt 2097152 ]; then
            echo "✖ Less than 2 GB free on runner — clean up before continuing."
            df -h
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Terminal cleanup — always runs, wipes per-run artifacts that would
  # otherwise accumulate forever on a persistent self-hosted workspace.
  # ─────────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Workspace Cleanup
    runs-on: [self-hosted, linux, ARM64]
    needs: [lint, test, build, e2e, supabase]
    if: always()
    steps:
      - name: Purge transient artifacts
        run: |
          rm -rf test-results playwright-report coverage .next || true
          echo "Remaining free space:"
          df -h .

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Lint & type-check
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    needs: [preflight]
    name: Lint & Type Check
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome ci src/

      - name: Oxlint
        run: bunx oxlint src/

      - name: TypeScript type check
        run: bunx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Run tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: [self-hosted, linux, ARM64]
    needs: [preflight]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Peer-dependency compatibility
        run: bun scripts/check-peer-deps.mjs --all

      - name: Run tests
        run: bun test

  # ─────────────────────────────────────────────────────────────────────────────
  # 2b. Production build
  #    `next build` exercises what Vercel will deploy — server/client compile,
  #    sitemap + robots generation. The sitemap does a live public read against
  #    Supabase with the anon key, so a revoked key or dead project URL fails
  #    here, not in production. NEXT_PUBLIC_* values are public by design (they
  #    ship in the browser bundle); storing them as secrets is fine for CI.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: [self-hosted, linux, ARM64]
    needs: [preflight]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Supabase — DB migrations + edge function deployments
  #    Only runs on push to main. Failure here fails the whole run.
  # ─────────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────────
  # 4b. Instant-navigation e2e guards (@next/playwright instant())
  #     Locks in the Cache Components shell contract: header/nav/footer must be
  #     visible the moment a navigation lands, before streamed data arrives.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: Instant Navigation E2E
    runs-on: [self-hosted, linux, ARM64]
    needs: [preflight, build]
    # 15m was cancelled mid cold-cache production build on the shared
    # self-hosted runner; 30m covers worst-case install+build+suite.
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build production bundle
        run: bun run build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # Single worker: the shared self-hosted ARM64 runner times out
      # timing-sensitive instant() guards under parallel load, and the same
      # tree has flipped green/red between runs. The suite is ~30s serial.
      - name: Run instant() navigation guards
        run: |
          bunx playwright test --workers=1 --retries=2 2>&1 | tee playwright-run.log
          exit ${PIPESTATUS[0]}

      - name: Upload Playwright report on failure
        if: failure()
        continue-on-error: true # artifact storage is unreliable on this runner
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # This runner's log blob upload is unreliable (BlobNotFound on every
      # API fetch) — persist stdout as an artifact so failures always leave
      # evidence.
      - name: Upload Playwright stdout
        if: always()
        continue-on-error: true # artifact storage is unreliable on this runner
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stdout
          path: playwright-run.log
          retention-days: 7

  supabase:
    name: Supabase (Migrations + Edge Functions)
    runs-on: [self-hosted, linux, ARM64]
    needs: [preflight, lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Pinned — a CLI major bump must be reviewed deliberately, never
          # surprise-shipped. Update after verifying against a live deploy.
          version: v2.113.0

      # ── 0. Local-only migration hygiene — pure file checks, no network ──────
      # Locked in here (not just lefthook) so merged code with a bypassed
      # local hook still trips a hard CI gate before anything is pushed.
      - name: Validate migration files
        run: |
          # Documented baselines (legacy files that predate the guards and are
          # superseded externally). Keep this list empty for new violations.
          # - 20260507000000_audiobookshelf_schema.sql: legacy audiobookshelf
          #   mirror tables that do not exist in this project DB (never
          #   effective / dropped). File is recorded as applied in the ledger,
          #   so it must not be deleted; its tables therefore need no RLS.
          # - 20240501000000_harden_profiles.sql: handle_new_user() SECURITY
          #   DEFINER superseded by 20260811020000_harden_legacy_schema.sql
          #   (replaced with SET search_path = '' version on the live DB).
          BASELINE_RLS="20260507000000_audiobookshelf_schema.sql"
          BASELINE_DEFINER="20240501000000_harden_profiles.sql"
          ERRORS=""
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if ! echo "$name" | grep -qE "^[0-9]{14}_[a-z0-9_]+\.sql$"; then
              ERRORS="$ERRORS\n  $name — must match ^YYYYMMDDHHMMSS_name.sql$"
            fi

            # RLS guard: every new CREATE TABLE must enable RLS in the same file
            if ! echo "$BASELINE_RLS" | tr ' ' '\n' | grep -qx "$name"; then
              TABLES=$(grep -oiE "CREATE TABLE (IF NOT EXISTS )?[a-zA-Z_\"]+" "$f" \
                | sed -E 's/CREATE TABLE (IF NOT EXISTS )?//' | tr -d '"' | grep -v "^$" || true)
              for tbl in $TABLES; do
                tbl_bare=$(echo "$tbl" | sed 's/.*\.//')
                if ! grep -qi "ALTER TABLE.*${tbl_bare}.*ENABLE ROW LEVEL SECURITY" "$f"; then
                  ERRORS="$ERRORS\n  $name — CREATE TABLE $tbl_bare without ENABLE ROW LEVEL SECURITY"
                fi
              done
            fi

            # SECURITY DEFINER guard: search_path must be pinned
            if ! echo "$BASELINE_DEFINER" | tr ' ' '\n' | grep -qx "$name"; then
              for lineno in $(grep -n "SECURITY DEFINER" "$f" | cut -d: -f1); do
                start=$((lineno - 5)); [ "$start" -lt 1 ] && start=1
                end=$((lineno + 10))
                if ! sed -n "${start},${end}p" "$f" | grep -qi "SET search_path"; then
                  ERRORS="$ERRORS\n  $name:${lineno} — SECURITY DEFINER without SET search_path"
                fi
              done
            fi
          done

          DUPES=$(ls supabase/migrations/ | grep -oE "^[0-9]{14}" | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            ERRORS="$ERRORS\n  duplicate migration versions: $(echo "$DUPES" | tr '\n' ' ')"
          fi

          if [ -n "$ERRORS" ]; then
            echo "::error::Migration file validation failed:"
            printf "%b\n" "$ERRORS"
            exit 1
          fi
          echo "✅ Migration files validated (naming, RLS, definer, uniqueness)"

      # ── 0. Fail loudly on misconfiguration — never skip silently ────────────
      # DB access is token-only (supabase db push --linked): the CLI leases a
      # connection through the Management API, so no DB password secret is
      # needed anywhere. Validate the secret *formats* up front so a malformed
      # token/ref fails in seconds here instead of at deploy time.
      - name: Verify configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets are not configured."
            exit 1
          fi
          if ! echo "$SUPABASE_ACCESS_TOKEN" | grep -qE '^sbp_[a-f0-9]{40}$'; then
            echo "::error::SUPABASE_ACCESS_TOKEN has an invalid format (expected sbp_ followed by 40 hex chars)."
            echo "::error::Create a classic PAT at https://supabase.com/dashboard/account/tokens —"
            echo "::error::  sbp_v0_.. (experimental) and legacy JWTs are rejected by the CLI."
            exit 1
          fi
          if ! echo "$SUPABASE_PROJECT_REF" | grep -qE '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF has an invalid format (expected 20 lowercase alphanumerics)."
            exit 1
          fi
          echo "✅ Configuration verified"

      # ── 1. Link project, then migrations: dry-run → apply (retry) → verify ─
      # Stale remote-only ledger rows (older manual syncs) block db push; they
      # are repaired as 'reverted' if found. Local-only pending migrations show
      # up in the dry-run and must all be applied.
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Run DB migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "── Pending migrations (dry-run) ──"
          PRE=$(supabase db push --linked --dry-run 2>&1 || true)
          echo "$PRE"
          if echo "$PRE" | grep -qE "Remote migration versions not found"; then
            echo "── Repairing stale remote-only migration ledger rows ──"
            VERSIONS=$(echo "$PRE" | grep -oE "[0-9]{14}" | sort -u | tr '\n' ' ')
            # shellcheck disable=SC2086
            supabase migration repair --status reverted --linked $VERSIONS --yes
          fi

          for attempt in 1 2 3; do
            echo "── db push (attempt $attempt/3) ──"
            if supabase db push --linked --yes; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::supabase db push failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

          echo "── Verifying nothing is pending ──"
          REMAINING=$(supabase db push --linked --dry-run 2>&1 || true)
          echo "$REMAINING"
          if echo "$REMAINING" | grep -qE "[0-9]{6,}_[a-z]"; then
            echo "::error::Migrations are still pending after push:"
            echo "$REMAINING"
            exit 1
          fi

          echo "── Verifying full ledger sync (local ↔ remote) ──"
          SYNC=$(supabase migration list --linked 2>&1)
          echo "$SYNC"
          BAD=$(echo "$SYNC" | awk -F'|' '
            $2 ~ /[0-9]{14}/ && $3 ~ /[0-9]{14}/ {
              gsub(/[` ]/, "", $2); gsub(/[` ]/, "", $3)
              if ($2 != $3) print "  local:" $2 "  remote:" $3
            }')
          if [ -n "$BAD" ]; then
            echo "::error::Migration ledger is NOT fully in sync (SQL editor drift or manual repair):"
            echo "$BAD"
            echo "::error::Resolve locally with: bun x supabase@latest migration repair --status reverted <versions> --linked"
            exit 1
          fi
          echo "✅ Migrations applied and ledger 100% in sync"

      # ── 1b. Data-plane smoke after migrations ───────────────────────────────
      # Proves the REST/PostgREST layer actually serves the applied schema with
      # the SAME anon publishable key the storefront uses in production —
      # fetched live from the Management API (single source of truth, never
      # duplicated into GitHub secrets). A corrupted schema, broken RLS, or
      # revoked key would surface here in seconds, not at 3am in the store.
      - name: Smoke-test REST + auth with the production anon key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          ANON=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; k=[x for x in json.load(sys.stdin) if x['name']=='anon']; print(k[0]['api_key'] if k else '')")
          if [ -z "$ANON" ]; then
            echo "::error::Could not fetch the anon key from the Management API."
            exit 1
          fi
          echo "anon key: ${ANON:0:6}…${ANON: -4} (fetched live from Management API)"

          PRODUCTS=$(curl -s -o /tmp/anon_products.json -w "%{http_code}" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "https://$PROJECT_REF.supabase.co/rest/v1/products?select=id&limit=1")
          AUTH_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON" \
            "https://$PROJECT_REF.supabase.co/auth/v1/health")
          echo "rest/v1/products → $PRODUCTS | auth/v1/health → $AUTH_HEALTH"
          if [ "$PRODUCTS" != "200" ] || [ "$AUTH_HEALTH" != "200" ]; then
            echo "::error::Data-plane smoke failed (products=$PRODUCTS, auth=$AUTH_HEALTH)."
            cat /tmp/anon_products.json 2>/dev/null || true
            exit 1
          fi
          echo "✅ REST + auth serving with the production anon key"

      # ── 2. Edge functions: pre-flight secrets + deploy each with retry ─────
      # Every function validates its required env vars at boot (and the boot
      # probes below would catch a missing one), but failing *before* deploy is
      # cheaper and the error is clearer. `supabase secrets list` is token-only.
      - name: Verify function secrets are provisioned
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          REQUIRED="STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY RESEND_API_KEY ADMIN_ORDER_EMAIL RESEND_FROM_EMAIL APP_URL"
          SECRETS=$(supabase secrets list --project-ref "$PROJECT_REF" | awk '{print $1}')
          MISSING=""
          for s in $REQUIRED; do
            if ! echo "$SECRETS" | grep -qx "$s"; then
              MISSING="$MISSING $s"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Function secrets missing from the Vault:$MISSING"
            echo "::error::Add them with: supabase secrets set <NAME>=<value> --project-ref $PROJECT_REF"
            echo "::error::Functions fail at boot without them — deploy aborted before shipping."
            exit 1
          fi
          echo "✅ Required function secrets present in Vault"

      # CLI-based deploy: bundles relative imports (e.g. checkout's
      # src/config/shipping.ts) and preserves function env from the Vault.
      # The raw Management API body deploy does NOT bundle — functions boot
      # with BOOT_ERROR — so we must use the CLI here.
      # --no-verify-jwt is explicit so a fresh function can never quietly
      # become JWT-gated (the storefront calls it with an anonymous key).
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for slug in webhook checkout notify-contact; do
            for attempt in 1 2 3; do
              echo "── deploy $slug (attempt $attempt/3) ──"
              if supabase functions deploy "$slug" --project-ref "$PROJECT_REF" --no-verify-jwt; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Deploy of $slug failed after 3 attempts."
                exit 1
              fi
              sleep 10
            done
          done
          echo "✅ Edge functions deployed"

      # ── 3. Post-deploy verification ─────────────────────────────────────────
      # (a) Management API reports ACTIVE, (b) the runtime actually boots
      # (2xx/4xx answer; 5xx means BOOT_ERROR or a crash at startup).
      - name: Verify function status is ACTIVE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for slug in webhook checkout notify-contact; do
            STATUS=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$slug" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','UNKNOWN'))")
            echo "  $slug: $STATUS"
            if [ "$STATUS" != "ACTIVE" ]; then
              echo "::error::$slug is $STATUS, expected ACTIVE."
              exit 1
            fi
          done
          echo "✅ All functions ACTIVE"

      - name: Verify functions boot in production
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # checkout probe: an impossible product id drives the real handler
          # path — JSON parse → cart normalization → Supabase product lookup
          # (service role key) → "Product not found" 400 — without ever
          # creating a Stripe session or an order.
          # webhook probe: unsigned {} is rejected at the first gate
          # (missing stripe-signature header) with 400 — proof it booted.
          # notify-contact probe: id=0 fails payload validation with 400 —
          # proof it booted, no email touched.
          probe() {
            case "$1" in
              checkout)       echo '{"items":[{"id":2147483647,"quantity":1}]}' ;;
              webhook)        echo '{}' ;;
              notify-contact) echo '{"id":0}' ;;
            esac
          }
          for slug in webhook checkout notify-contact; do
            for attempt in 1 2 3 4 5; do
              RESP=$(curl -s -w "\n%{http_code}" \
                -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$slug" \
                -H "Content-Type: application/json" -d "$(probe "$slug")")
              CODE=$(echo "$RESP" | tail -n1)
              if [[ "$CODE" != 5* ]] && [[ "$CODE" != "000" ]]; then
                echo "  $slug booted (HTTP $CODE)"
                break
              fi
              echo "  $slug not ready (HTTP $CODE) — attempt $attempt/5"
              if [ "$attempt" -eq 5 ]; then
                echo "::error::$slug fails to boot (HTTP $CODE). Response:"
                echo "$RESP" | head -n -1
                exit 1
              fi
              sleep 5
            done
          done
          echo "✅ Both functions booted"

      # ── 4. Deployment summary — a durable record on every run ──────────────
      - name: Publish deployment summary
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          {
            echo "## ☁️ Supabase deployment"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Tooling:**"
            echo '```'
            echo "supabase CLI: $(supabase --version)"
            echo '```'
            echo ""
            echo "### Edge functions"
            echo '```'
            curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | python3 -c "import json,sys; [print(f\"{f['slug']}: {f['status']} v{f['version']}\") for f in json.load(sys.stdin)]"
            echo '```'
            echo ""
            echo "### Migration ledger"
            echo '```'
            supabase migration list --linked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Summary published"

  # Vercel deployment is handled automatically by Vercel's GitHub integration.
  # Push to main → Vercel detects and deploys. No workflow step needed.
