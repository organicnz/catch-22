name: Daily Compatibility

# Nightly guard for the whole stack: dependency drift, types, unit tests,
# production site health, production function boot probes, and an AI second-opinion
# review of the last 24h of changes.
#
# Note: Next.js builds and deployments are computed natively by Vercel.
#
# Findings from the AI job are advisory (continue-on-error): models hallucinate,
# humans triage. Failures in the compat matrix itself page like CI failures.

on:
  schedule:
    - cron: '17 21 * * *' # 21:17 UTC daily — off the top of the hour
  workflow_dispatch:

concurrency:
  group: daily-compat
  cancel-in-progress: false

jobs:
  compatibility:
    name: Lint · Test · Probes
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      # Mirror deploy.yml's build contract — the validated env layer refuses
      # to parse without these.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint + format + types
        run: |
          bun run lint:check
          bun run format:check
          bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Probe site health
        run: |
          df -h / | tail -1 # disk exhaustion mid-job kills later steps silently
          # NEXT_PUBLIC_SITE_URL is the bare apex (catch-22.co.nz), which 308s
          # to www — follow redirects and judge the destination.
          CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 \
            "${SITE_URL:-https://catch-22.co.nz}/api/health")
          echo "api/health → $CODE"
          [ "$CODE" = "200" ]

      - name: Probe edge functions boot
        shell: bash {0} # no errexit: emit per-probe evidence even when curl fails
        run: |
          set +e
          FAILURES=0
          HOST="$SUPABASE_PROJECT_REF.supabase.co"

          # Resolver-path insurance: if system DNS cannot answer for the host
          # (observed once on hosted runners), fall back to DoH-pinned IP.
          IP=$(curl -s --max-time 10 "https://dns.google/resolve?name=$HOST&type=A" | jq -r "[.Answer // [] | .[] | select(.type == 1) | .data] | first // empty")
          PIN=""
          [ -n "$IP" ] && PIN="--resolve $HOST:443:$IP"

          for slug in webhook checkout notify-contact; do
            case "$slug" in
              checkout)       BODY='{"items":[{"id":2147483647,"quantity":1}]}' ;;
              webhook)        BODY='{}' ;;
              notify-contact) BODY='{"id":0}' ;;
            esac
            echo "probing $slug ..."
            CODE=$(curl -s $PIN -o /dev/null -w "%{http_code}" --max-time 20 \
              -X POST "https://$HOST/functions/v1/$slug" \
              -H "Content-Type: application/json" -d "$BODY")
            CURL_RC=$?
            echo "  $slug → HTTP ${CODE:-none} (curl rc=$CURL_RC)"
            if [ "$CURL_RC" -ne 0 ] || [[ "$CODE" =~ ^5 ]] || [ "$CODE" = "000" ]; then
              echo "::error::$slug unhealthy (HTTP ${CODE:-none}, curl rc=$CURL_RC)"
              FAILURES=$((FAILURES+1))
            fi
          done
          if [ "$FAILURES" -gt 0 ]; then exit 1; fi
          echo "✅ all edge functions booted"

      - name: Workspace cleanup
        if: always()
        run: rm -rf test-results coverage || true

  ai-nightly-review:
    name: AI Review (last 24h)
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [compatibility]
    if: always() && needs.compatibility.result == 'success'
    continue-on-error: true # advisory — model output never fails the run
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # enough history for a 24h diff window

      - uses: oven-sh/setup-bun@v2

      # Either provider satisfying the review counts as delivered: Groq's
      # free tier exhausts fast (200k tokens/day), so Z.ai is the fallback,
      # not a duplicate opinion.
      - name: AI review of last 24h (Groq, falling back to Z.ai)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          SINCE=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -v-1d +%Y-%m-%dT%H:%M:%S)
          if ! node scripts/ai-review.mjs --provider groq --since "$SINCE"; then
            echo "::warning::Groq unavailable — falling back to Z.ai"
            node scripts/ai-review.mjs --provider zai --since "$SINCE"
          fi
