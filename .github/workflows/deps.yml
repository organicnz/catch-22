name: Dependencies

# Dependency health: drift report + security gates + runtime compatibility.
# Runs nightly, on any change to the dependency manifest, and on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit & Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # ── 1. Runtime compatibility ────────────────────────────────────────────
      # Fail if the runner's Node/Bun no longer satisfies package.json engines
      # (e.g. the pinned Next.js version raises its minimum Node requirement).
      - name: Check runtime compatibility
        run: |
          REQUIRE_NODE=$(node -e "console.log(require('./package.json').engines?.node ?? '')")
          REQUIRE_BUN=$(node -e "console.log(require('./package.json').engines?.bun ?? '')")
          RUNNER_NODE="node $(node --version)"
          RUNNER_BUN="bun $(bun --version)"
          echo "$RUNNER_NODE | engines.node: ${REQUIRE_NODE:-unset}"
          echo "$RUNNER_BUN | engines.bun: ${REQUIRE_BUN:-unset}"
          node - <<'EOF'
            const semver = (v) => v.replace(/^[v=^~]/, '').split('.').map(Number);
            const cmp = (a, b) => (a[0]-b[0]) || (a[1]-b[1]) || (a[2]-b[2]);
            const pkg = require('./package.json');
            const nodeCur = semver(process.version);
            const bunCur = semver(require('child_process').execSync('bun --version').toString().trim());
            const checks = [
              { name: 'node', cur: nodeCur, range: pkg.engines?.node },
              { name: 'bun', cur: bunCur, range: pkg.engines?.bun },
            ];
            let failed = false;
            for (const c of checks) {
              const m = c.range?.match(/>=?\s*(\d+)\.(\d+)\.(\d+)/);
              if (!m) {
                if (c.range) {
                  console.log(`❌ ${c.name} engines range unparseable: ${c.range}`);
                  failed = true;
                } else {
                  console.log(`✅ ${c.name} ${c.cur.join('.')} (engines: unset)`);
                }
                continue;
              }
              const min = [Number(m[1]), Number(m[2]), Number(m[3])];
              const ok = cmp(c.cur, min) >= 0;
              console.log(`${ok ? '✅' : '❌'} ${c.name} ${c.cur.join('.')} ${ok ? 'satisfies' : 'does NOT satisfy'} engines: ${c.range}`);
              if (!ok) failed = true;
            }
            process.exit(failed ? 1 : 0);
          EOF

      # ── 2. Security gate — production dependencies ─────────────────────────
      # High/critical vulnerabilities in runtime deps block the pipeline.
      - name: Audit production dependencies
        run: |
          bun audit --production --audit-level=high 2>&1 | tee /tmp/audit-prod.log || {
            echo "::error::High/critical vulnerabilities in production dependencies."
            exit 1
          }
          echo "✅ No high/critical vulnerabilities in production deps"

      # ── 2b. Critical anywhere (prod OR dev tooling) blocks the run ─────────
      # Moderate/high issues in dev-only tooling are informational, but a
      # critical advisory anywhere is a hard failure.
      - name: Gate critical vulnerabilities (all dependencies)
        run: |
          if bun audit --audit-level=critical >/tmp/audit-critical.log 2>&1; then
            echo "✅ No critical vulnerabilities in any dependency"
          else
            echo "::error::Critical vulnerability found in a dependency."
            cat /tmp/audit-critical.log
            exit 1
          fi

      # ── 3. Drift report (non-blocking, informational) ──────────────────────
      # Outdated packages are surfaced in the job summary, never silently.
      - name: Report outdated packages
        continue-on-error: true
        run: |
          {
            echo "## 📦 Outdated packages"
            echo ""
            bun outdated 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Report written to job summary"

      # ── 4. Full audit report (incl. dev tooling, informational) ───────────
      - name: Report full audit (dev tooling included)
        continue-on-error: true
        run: |
          {
            echo "## 🛡 Full audit (production + dev tooling)"
            echo ""
            bun audit 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Report written to job summary"

      # ── 5. Project health on the latest runtime ────────────────────────────
      # The nightly cron runs on bun/node `latest`, which push-based CI alone
      # never exercises when nothing is committed. Type-check + full test
      # suite prove the pinned deps still build and pass on a newer toolchain
      # (the engines check above covers the version floors).
      - name: Type-check on latest runtime
        run: bunx tsc --noEmit

      - name: Run test suite on latest runtime
        run: bun test